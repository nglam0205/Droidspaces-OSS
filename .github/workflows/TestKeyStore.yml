
name: Test Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-keystore:
    name: Validate Android Release Signing Key
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Required Secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          echo "All required secrets are configured."

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail

          printf '%s' "$RELEASE_KEYSTORE" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

          echo "Keystore decoded successfully."

      - name: Validate Keystore Password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Keystore password is valid."

      - name: Validate Alias and Private Key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          INFO="$RUNNER_TEMP/key-info.txt"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > "$INFO"

          if ! grep -q "Entry type: PrivateKeyEntry" "$INFO"; then
            echo "::error::Alias is not a PrivateKeyEntry"
            exit 1
          fi

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/test.csr" \
            -noprompt

          echo "Alias and private key are valid."

      - name: Show Keystore Information
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "Keystore type:|Alias name:|Entry type:|Valid from:"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          rm -f "$RUNNER_TEMP/key-info.txt"
          rm -f "$RUNNER_TEMP/test.csr"

      - name: Result
        run: echo "Release keystore validation completed successfully."
        
