name: Droidspaces CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Backend & Android App
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
      TOOLCHAINS_URL: https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Cache Toolchains
        id: toolchains
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: musl-toolchains-${{ env.TOOLCHAINS_URL }}

      - name: Download Toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          set -e

          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          for t in \
            aarch64-linux-musl \
            arm-linux-musleabihf \
            i686-linux-musl \
            x86_64-linux-musl \
            riscv64-linux-musl
          do
            echo "Downloading $t..."
            wget -q "$TOOLCHAINS_URL/$t-cross.tar.zst"
            tar -xf "$t-cross.tar.zst"
            rm "$t-cross.tar.zst"
          done

      - name: Build Backend & Debian Packages
        run: |
          set -e
          make all-tarball
          scripts/mkdeb.sh

      # All APK builds use your permanent release signing key.
      - name: Validate Release Signing Secrets
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          for name in RELEASE_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "All signing secrets are configured."

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -e

          echo "$RELEASE_KEYSTORE" | base64 --decode > droidspaces.keystore

          test -s droidspaces.keystore

          echo "Keystore decoded successfully."

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd Android

          ./gradlew assembleRelease --no-daemon \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK Signature
        run: |
          set -e

          APK="Android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK signature verified successfully."

      - name: Stage & Rename Artifacts
        run: |
          set -e

          HASH=$(git log -1 --pretty=%h)
          APK_NAME="Droidspaces-universal-v${VERSION}-${HASH}.apk"

          TAR_NAME=$(ls droidspaces-v*-*.tar.gz)

          mkdir -p dist

          cp Android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"

          mv "$TAR_NAME" droidspaces_*.deb dist/

          cd dist
          sha256sum * > SHA256SUMS

          echo "APK_FILE=dist/$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Generate Changelog
        if: env.TAG != ''
        run: |
          set -e

          END=HEAD

          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && END="${TAG}"

          PREV=$(git describe --tags --abbrev=0 "${END}^" 2>/dev/null || true)

          {
            echo "## What's Changed"
            git log --no-merges --pretty=format:"* %s (%h)" ${PREV:+${PREV}..}${END}
            echo
            echo
            echo "---"
            echo "**Automated Release by Droidspaces CI**"
          } > dist/CHANGELOG.md

      - name: Publish GitHub Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Droidspaces ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          body_path: dist/CHANGELOG.md
          draft: false
          prerelease: false

      - name: Rebuild Documentation Website
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.WEBPAT }}
        run: |
          gh api repos/droidspaces/droidspaces.github.io/dispatches \
            -f event_type=docs-updated
